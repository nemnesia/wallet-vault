apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'
react { debuggableVariants = []; autolinkLibrariesWithApp() }
android {
    namespace 'dev.vault.prototype'
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    ndkVersion rootProject.ext.ndkVersion
    defaultConfig {
        applicationId 'dev.vault.prototype'
        minSdkVersion 30
        targetSdkVersion 36
        testInstrumentationRunner 'dev.vault.prototype.VaultInstrumentation'
        versionCode 1
        versionName '0.0.1'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    buildTypes {
        release { signingConfig signingConfigs.debug; minifyEnabled false }
    }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    implementation('com.facebook.react:react-android')
    implementation('com.facebook.react:hermes-android')
    testImplementation('junit:junit:4.13.2')
}
