[package]
name = "rust-vault"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
# Enable destruction of expanded AES keys and GHASH state in the AEAD backend.
aes = { version = "=0.8.4", features = ["zeroize"] }
ghash = { version = "=0.5.1", features = ["zeroize"] }
polyval = { version = "=0.6.2", features = ["zeroize"] }
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "zeroize"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["zeroize"] }
hmac = { version = "=0.13.0", features = ["zeroize"] }
sha2 = { version = "=0.11.1", features = ["zeroize"] }
zeroize = { version = "=1.9.0", features = ["derive"] }
getrandom = "=0.3.4"
p256 = { version = "=0.13.2", default-features = false, features = ["arithmetic"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.3.4", features = ["wasm_js"] }

[dev-dependencies]
hex = "=0.4.3"

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen]
version = "=0.2.127"

[target.'cfg(target_arch = "wasm32")'.dependencies.js-sys]
version = "=0.3.104"

[target.'cfg(target_arch = "wasm32")'.dependencies.wasm-bindgen-futures]
version = "=0.4.77"
